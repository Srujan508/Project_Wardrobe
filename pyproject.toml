[project]
name = "project-wardrobe"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pyrefly]
search-path = ["."]
python-interpreter = "venv/Scripts/python.exe"

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: slow tests on the real Polyvore data / real models (run with: pytest -m integration)",
    "e2e: real-browser Playwright tests against a live server (run with: pytest -m e2e)",
]
