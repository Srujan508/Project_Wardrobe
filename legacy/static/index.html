<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stylist Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 900: '#111827', 800: '#1f2937', 700: '#374151' },
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="p-6">
            <h1 class="text-2xl font-bold tracking-wider text-brand-500">Stylist<span class="text-white">AI</span></h1>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-3 rounded-lg bg-gray-700 hover:bg-gray-600 transition">✨ Get Styled</button>
            <button onclick="switchTab('wardrobe'); loadWardrobe();" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-700 transition">👕 My Wardrobe</button>
            <button onclick="switchTab('upload')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-700 transition">➕ Add Clothes</button>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-10">
        
        <div id="dashboard" class="tab-content">
            <h2 class="text-3xl font-bold mb-2">Your Daily Stylist</h2>
            <p class="text-gray-400 mb-8">Let the neural network build your perfect outfit.</p>
            
            <button onclick="getSuggestion()" class="bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition transform hover:scale-105">
                Generate Perfect Outfit
            </button>

            <div id="loading" class="hidden mt-8 text-brand-500 animate-pulse font-semibold text-lg">
                Analyzing vector combinations...
            </div>

            <div id="result-container" class="hidden mt-10 bg-gray-800 p-8 rounded-2xl border border-gray-700 max-w-3xl">
                <div id="score-display" class="text-2xl font-bold text-green-400 mb-6 border-b border-gray-700 pb-4"></div>
                <div class="flex justify-center gap-8">
                    <div class="text-center">
                        <p class="text-gray-400 mb-2 font-semibold tracking-wide uppercase text-sm">Top</p>
                        <img id="res-top" src="" class="h-64 object-cover rounded-lg shadow-md border-2 border-gray-700">
                    </div>
                    <div class="text-center">
                        <p class="text-gray-400 mb-2 font-semibold tracking-wide uppercase text-sm">Bottom</p>
                        <img id="res-bottom" src="" class="h-64 object-cover rounded-lg shadow-md border-2 border-gray-700">
                    </div>
                </div>
            </div>
        </div>

        <div id="wardrobe" class="tab-content hidden">
            <h2 class="text-3xl font-bold mb-8">My Digital Closet</h2>
            
            <h3 class="text-xl font-semibold mb-4 text-gray-300 border-b border-gray-700 pb-2">Tops</h3>
            <div id="wardrobe-tops" class="grid grid-cols-4 gap-4 mb-10">
                </div>

            <h3 class="text-xl font-semibold mb-4 text-gray-300 border-b border-gray-700 pb-2">Bottoms</h3>
            <div id="wardrobe-bottoms" class="grid grid-cols-4 gap-4">
                </div>
        </div>

        <div id="upload" class="tab-content hidden max-w-2xl">
            <h2 class="text-3xl font-bold mb-8">Add to Closet</h2>
            
            <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 mb-6">
                <h3 class="text-xl font-semibold mb-4">Upload a Top</h3>
                <input type="file" id="topFile" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gray-700 file:text-white hover:file:bg-gray-600 mb-4">
                <button onclick="uploadItem('tops', 'topFile')" class="bg-gray-700 hover:bg-gray-600 py-2 px-6 rounded-lg font-semibold transition">Upload Top</button>
            </div>

            <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700">
                <h3 class="text-xl font-semibold mb-4">Upload a Bottom</h3>
                <input type="file" id="bottomFile" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gray-700 file:text-white hover:file:bg-gray-600 mb-4">
                <button onclick="uploadItem('bottoms', 'bottomFile')" class="bg-gray-700 hover:bg-gray-600 py-2 px-6 rounded-lg font-semibold transition">Upload Bottom</button>
            </div>
        </div>

    </main>

    <script>
        // Simple Tab Routing
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        // Upload Logic
        async function uploadItem(category, inputId) {
            const fileInput = document.getElementById(inputId);
            if (fileInput.files.length === 0) return alert("Please select an image.");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("category", category);

            const btn = fileInput.nextElementSibling;
            btn.innerText = "Uploading...";

            try {
                const response = await fetch("/upload-item", { method: "POST", body: formData });
                const result = await response.json();
                alert(result.message);
                fileInput.value = ""; 
            } catch (e) {
                alert("Upload failed.");
            }
            btn.innerText = `Upload ${category === 'tops' ? 'Top' : 'Bottom'}`;
        }

        // Styling Logic
        async function getSuggestion() {
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("loading").classList.remove("hidden");
            
            try {
                const response = await fetch("/get-suggestion");
                const data = await response.json();
                
                document.getElementById("loading").classList.add("hidden");

                if (response.ok) {
                    document.getElementById("res-top").src = data.top_image;
                    document.getElementById("res-bottom").src = data.bottom_image;
                    document.getElementById("score-display").innerHTML = `AI Match Score: ${data.score}/100 <span class="text-sm font-normal text-gray-400 block mt-1">${data.message}</span>`;
                    document.getElementById("result-container").classList.remove("hidden");
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                document.getElementById("loading").classList.add("hidden");
                alert("Ensure you have at least one top and bottom uploaded.");
            }
        }

        // Fetch Wardrobe Images
        async function loadWardrobe() {
            try {
                const response = await fetch("/get-wardrobe");
                const data = await response.json();

                const topsDiv = document.getElementById("wardrobe-tops");
                const bottomsDiv = document.getElementById("wardrobe-bottoms");
                
                topsDiv.innerHTML = data.tops.map(img => `<img src="${img}" class="h-48 w-full object-cover rounded-lg border border-gray-700 shadow-sm">`).join('');
                bottomsDiv.innerHTML = data.bottoms.map(img => `<img src="${img}" class="h-48 w-full object-cover rounded-lg border border-gray-700 shadow-sm">`).join('');
                
                if(data.tops.length === 0) topsDiv.innerHTML = '<p class="text-gray-500">No tops uploaded yet.</p>';
                if(data.bottoms.length === 0) bottomsDiv.innerHTML = '<p class="text-gray-500">No bottoms uploaded yet.</p>';
            } catch (e) {
                console.error("Failed to load wardrobe.");
            }
        }
    </script>
</body>
</html>
